name: GROZA-40 focused integration checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  groza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify original gameplay modules and GROZA-40
        run: |
          node --check dist/groza40.js
          node --check dist/weapons.js
          node --check dist/game-logic.js
          node --check dist/shooting-range.js
          node --check dist/combat-hud.js
          node --test tests/groza40-integration.test.mjs tests/397-xr-all-weapons-alignment.test.mjs tests/334-training-range.test.mjs tests/339-quest-laser-floor.test.mjs
