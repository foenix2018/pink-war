name: LYLU V5 integration and regression
on:
  push:
    branches: [feature/lylu-v5-animated-integration]
    paths: ['.github/workflows/lylu-v5-integration.yml', 'tools/blender/lylu_v5_animated.py', 'dist/lylu-civil-hideout.js', 'dist/planque.js', 'tools/verify-lylu-v5-motion.mjs', 'tools/verify-planque-civil-pause.mjs']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LYLU-native-motion-source
          run-id: 45406074519
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-source
      - uses: actions/download-artifact@v4
        with:
          name: LYLU-runtime-motion-source
          run-id: 45406543022
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime-source
      - name: Reproduce V5 asset
        run: |
          python -m pip install --quiet numpy scipy
          python tools/blender/lylu_v5_animated.py
          node --check dist/lylu-civil-hideout.js
          node --check dist/planque.js
          node --test tests/389-hideout.test.mjs tests/391-hideout-nano-chambers.test.mjs tests/392-outfit-stages.test.mjs tests/3853-camera-options.test.mjs
      - name: Browser animation and capsule regressions
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          python -m http.server 4173 --directory dist >/tmp/lylu-motion-server.log 2>&1 &
          node tools/verify-lylu-v5-motion.mjs
          node tools/verify-planque-civil-pause.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LYLU-V5-integration-check
          path: |
            dist/assets/heroes/lylu-civil-v5.glb
            lylu-v5-check/
            planque-civil-pause-check/
      - name: Bundle asset only after successful tests
        run: |
          git config user.name "Pink Wars validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/heroes/lylu-civil-v5.glb
          git commit -m "Bundle validated LYLU V5 with 30 native animations"
          git push origin HEAD:feature/lylu-v5-animated-integration
