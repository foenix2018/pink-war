name: Jetpack preview - focused physics and FX
on:
  pull_request:
    paths:
      - 'dist/locomotion.js'
      - 'dist/game-logic.js'
      - 'dist/jetpack-fx.js'
      - 'dist/rlh-firefighter.js'
      - 'dist/game.js'
      - 'tests/411-jetpack-hover.test.mjs'
      - '.github/workflows/jetpack-preview.yml'
permissions:
  contents: read
jobs:
  jetpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check dist/locomotion.js
          node --check dist/game-logic.js
          node --check dist/game.js
          node --check dist/rlh-firefighter.js
          node --check dist/jetpack-fx.js
          node --check dist/jetpack-audio.js
      - name: Check hover, jump and smoke
        run: node --test tests/jump.test.mjs tests/411-jetpack-hover.test.mjs
