name: Planque gym integration
on:
  push:
    branches: [feature/planque-gym-20261124]
    paths: ['tools/blender/hideout.py', '.github/workflows/planque-gym.yml', 'dist/hideout-art.js', 'dist/hideout-showcase-assets.js', 'tests/planque-proportions.test.mjs', 'tools/verify-planque-gym.mjs', 'tests/planque-gym.test.mjs', 'dist/planque.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the real Blender model and game geometry
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python tools/blender/hideout.py
      - name: Verify dimensions, collisions and existing planque logic
        run: |
          node --check dist/hideout-art.js
          node --check dist/hideout-showcase-assets.js
          node --test tests/planque-gym.test.mjs tests/planque-proportions.test.mjs tests/389-hideout.test.mjs tests/3893-hideout-rooms-city.test.mjs tests/391-hideout-nano-chambers.test.mjs
      - name: Capture actual in-game previews
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m http.server 4173 --directory dist >/tmp/planque-server.log 2>&1 &
          node tools/verify-planque-gym.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planque-gym-preview
          path: planque-gym-check/
      - name: Bundle validated geometry in the preview branch
        run: |
          git config user.name "Pink Wars validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hideout/PinkWars_Planque.blend dist/assets/hideout/PinkWars_Planque.blend dist/assets/hideout/planque.pwm.gz dist/assets/hideout/layout.json dist/assets/hideout/stats.json
          git add -f planque-gym-check/*.png
          git diff --cached --quiet || git commit -m "Bundle tested gym geometry and real screenshots"
          git push origin HEAD:feature/planque-gym-20261124
