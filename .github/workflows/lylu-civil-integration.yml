name: LYLU civilian V4 integration
on:
  push:
    branches: [feature/lylu-civil-hideout-v4]
    paths:
      - .github/workflows/lylu-civil-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender Python module
        run: |
          python -m pip install --disable-pip-version-check --retries 3 --timeout 60 --only-binary=:all: bpy==4.3.0
          python -c 'import bpy; print(bpy.app.version_string)'
      - name: Build and test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 45313491080 --name LYLU-civil-Blender-V4 --dir workshop-artifact
          python -u tools/blender/lylu_civil_game.py
          python tools/blender/verify_lylu_game.py
          node --check dist/lylu-civil-hideout.js
          node --check dist/planque.js
      - uses: actions/upload-artifact@v4
        with:
          name: LYLU-civil-V4-integration
          path: |
            lylu-integration/
            dist/assets/heroes/lylu-civil-v4.glb
