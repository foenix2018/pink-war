name: LYLU civilian V4 hideout integration
on:
  push:
    branches: [feature/lylu-civil-hideout-v4]
    paths:
      - .github/workflows/lylu-civil-integration.yml
      - tools/blender/lylu_civil_game.py
      - tools/verify-lylu-civil.mjs
      - dist/lylu-civil-hideout.js
      - dist/planque.js
      - dist/planque.html
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lylu-civil-game-integration
  cancel-in-progress: true
jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: LYLU-civil-Blender-V4
          run-id: 45313491080
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: workshop-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender Python module
        run: python -m pip install --disable-pip-version-check --retries 3 --timeout 60 --only-binary=:all: bpy==4.3.0
      - name: Rig exact V4 blend and export optimized facial morph asset
        env:
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python -u tools/blender/lylu_civil_game.py
      - name: Check rig and GLB budgets
        run: |
          python - <<'PY'
          import pathlib,struct,json
          p=pathlib.Path('dist/assets/heroes/lylu-civil-v4.glb')
          x=p.read_bytes(); assert x[:4]==b'glTF'
          n=struct.unpack_from('<I',x,12)[0];d=json.loads(x[20:20+n])
          morphs={name for m in d['meshes'] for name in m.get('extras',{}).get('targetNames',[])}
          assert {'Blink','Smile','Focus','Surprise'} <= morphs,morphs
          assert d.get('skins') and len(d['skins'][0]['joints'])>=17
          triangles=sum(d['accessors'][p['indices']]['count']//3 for m in d['meshes'] for p in m['primitives'])
          draws=sum(len(m['primitives']) for m in d['meshes'])
          assert triangles<230000,(triangles,draws)
          assert draws<=30,(triangles,draws)
          print('Validated',triangles,'triangles',draws,'draw calls',morphs,len(x),'bytes')
          pathlib.Path('lylu-integration/model-stats.json').write_text(json.dumps({'triangles':triangles,'drawCalls':draws,'bytes':len(x),'expressions':sorted(morphs)},indent=2))
          PY
          node --check dist/lylu-civil-hideout.js
          node --check dist/planque.js
      - name: Test existing hideout and suit progression logic
        run: node --test tests/389-hideout.test.mjs tests/391-hideout-nano-chambers.test.mjs tests/392-outfit-stages.test.mjs
      - name: Browser test in real hideout with WebGL
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          python -m http.server 4173 --directory dist >/tmp/lylu-server.log 2>&1 &
          node tools/verify-lylu-civil.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LYLU-civil-V4-integration
          if-no-files-found: warn
          path: |
            lylu-integration/
            dist/assets/heroes/lylu-civil-v4.glb
      - name: Publish only after successful integration checks
        run: |
          git config user.name "Pink Wars LYLU Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/heroes/lylu-civil-v4.glb
          git commit -m "Add tested LYLU civilian V4 game asset and facial morphs"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "Main advanced; no production changes applied"; exit 1; }
          git push origin HEAD:feature/lylu-civil-hideout-v4
          git push origin HEAD:main
