name: Pink War - mini-jetpack preview
on:
  push:
    branches: [preview/ghju-lylu-jetpack-hover-20261119]
  pull_request:
    paths:
      - 'dist/jetpack-fx.js'
      - 'dist/jetpack-audio.js'
      - 'dist/locomotion.js'
      - 'dist/game-logic.js'
      - 'dist/rlh-firefighter.js'
      - 'dist/game.js'
      - 'tests/411-jetpack-hover.test.mjs'
permissions:
  contents: read
jobs:
  jetpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Vérifier la syntaxe du moteur mini-jetpack
        run: |
          node --check dist/jetpack-fx.js
          node --check dist/jetpack-audio.js
          node --check dist/locomotion.js
          node --check dist/game-logic.js
          node --check dist/rlh-firefighter.js
          node --check dist/game.js
      - name: Tester les sauts GHJU et LYLU à 30, 60 et 120 Hz
        run: node --test tests/411-jetpack-hover.test.mjs
