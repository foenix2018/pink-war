name: Pink War - tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntaxe des scripts
        run: |
          node --check dist/game.js
          node --check dist/game-logic.js
          node --check dist/soldier.js
          node --check dist/scene.js
          node --check dist/vr.js
          node --check dist/at-home.js
          node --check dist/at-home-assets.js
          node --check dist/world-art.js
      - name: Tests unitaires
        run: npm test
