</style><canvas id="view" aria-label="Modèle 3D du Rempart B-11"></canvas><header><p>PINK WARS · UNITÉ DE SUPPRESSION</p><h1>REMPART B-11</h1></header><small>Glisser pour tourner · molette pour zoomer</small><nav aria-label="Animation"><button data-pose="idle" aria-pressed="true">Arrêt</button><button data-pose="walk" aria-pressed="false">Marche</button><button data-pose="run" aria-pressed="false">Course</button><button data-pose="cover" aria-pressed="false">Accroupi</button><button data-pose="aim" aria-pressed="false">Visée</button></nav><script type="module">
import * as T from './vendor/three.module.min.js';
