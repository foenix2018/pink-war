<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PINK WARS — Galerie</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#080b13;color:#edf1fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29203b,#080b13 65%);min-height:100vh}header{padding:24px max(20px,5vw);border-bottom:1px solid #62446c}a{color:#f5a1d3;text-decoration:none}h1{letter-spacing:.16em;color:#fa85c7;margin:12px 0}main{max-width:1100px;margin:auto;padding:22px}nav{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #6b537b;background:#1b2030;color:white;border-radius:11px;padding:13px 16px;font-weight:700;cursor:pointer}button[aria-selected=true]{background:#6b2859;border-color:#f38ac5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #53435e;background:linear-gradient(150deg,#222337,#111722);border-radius:16px;padding:18px;min-height:190px}.card h2{color:#f8a4d5;margin:0 0 10px}.card p{line-height:1.5;color:#cbd2e1}.tag{font-size:12px;color:#91d7f5;letter-spacing:.12em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stats span{padding:10px;background:#0c111e;border-radius:7px;font-size:13px}.muted{color:#9ba5b8}#notice{font-size:13px;color:#b6bfd0}footer{padding:25px;text-align:center;color:#8c95a8} .viewer{position:fixed;inset:0;background:#050711f5;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.viewer[hidden]{display:none}.viewer-panel{width:min(850px,100%);background:#141a2b;border:1px solid #ba6d9c;border-radius:18px;padding:16px}.viewer model-viewer{width:100%;height:min(56vh,510px);background:radial-gradient(#30344c,#0a0c15);border-radius:12px}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.viewer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.viewer-actions button{flex:1}.viewer-actions button:disabled{opacity:.5;cursor:not-allowed} .model-stage{position:relative;height:min(56vh,510px);min-height:280px;background:radial-gradient(#30344c,#0a0c15);border-radius:12px;overflow:hidden;touch-action:none}.model-stage canvas,.model-stage model-viewer{width:100%;height:100%;display:block;touch-action:none}.model-stage [hidden]{display:none!important}.viewer-panel{max-height:94dvh;overflow:auto}.card button{min-height:42px}button:focus-visible{outline:2px solid #ff97ca;outline-offset:2px}</style></head><body><header><a href="./">← RETOUR ACCUEIL</a><h1>PINK WARS / GALERIE</h1><div class="muted">ARCHIVES TACTIQUES · VESPER</div></header><main><nav id="tabs" aria-label="Rubriques de la galerie"><button data-tab="characters" aria-selected="true">PERSONNAGES</button><button data-tab="arsenal" aria-selected="false">ARMES · CAPACITÉS</button><button data-tab="enemies" aria-selected="false">ENNEMIS</button><button data-tab="stats" aria-selected="false">ARMES · STATISTIQUES</button></nav><p id="notice">Les chiffres non vérifiés dans le moteur de combat sont indiqués « À synchroniser ».</p><section id="content" class="grid" aria-live="polite"></section></main><div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Visualisation 3D"><div class="viewer-panel"><div class="viewer-head"><h2 id="viewer-title">OBJET 3D</h2><button id="viewer-close" type="button">✕ FERMER</button></div><div class="model-stage" id="model-stage"><canvas id="native-model" aria-label="Modèle 3D original de Pink Wars, orientable au toucher" style="touch-action:none"></canvas><model-viewer id="model" hidden camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="0.9" exposure="1.15" ar ar-modes="webxr scene-viewer quick-look" touch-action="pan-y" alt="Objet 3D de Pink Wars"></model-viewer></div><div class="viewer-actions"><button id="rotation" type="button">⟳ ROTATION AUTO</button><button id="ar-launch" type="button">AR · VOIR CHEZ MOI</button></div><p id="viewer-message" class="muted">Glisser pour tourner · pincer pour zoomer. AR selon compatibilité du navigateur.</p></div></div><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script><footer>PINK WARS · DOSSIERS DE COMBAT</footer><script>
const entries={
characters:[["GHJU","COMBATTANTE · ROSE","Personnage jouable, armure Shadow Unit et squelette animé d'origine. GABY : bouclier et soin."],["LYLU","COMBATTANT · BLEU","Personnage jouable, armure Shadow Unit et squelette animé d'origine. CARA : renfort offensif."],["GABY","IA · DÉFENSE","Sphère autonome active qui protège et soigne GHJU."],["CARA","IA · ATTAQUE","Sphère autonome active qui accroît les dégâts de LYLU."]],
arsenal:[["VX-9","PISTOLET","Arme de poing Orbital Defense."],["NEXUS V9","AUTOMATIQUE","Mitraillette tactique à tir rapide."],["ARES X9","PRÉCISION","Fusil de précision numérique et viseur dédié."],["THORN","CANON À RAIL","Tir chargé et zone d'impact."],["NOVA","ÉNERGIE","Canon à énergie : modèle Pink War IV MK4 actif."],["AURORA","SABRE","Sabre à énergie et parade rapprochée."],["M–12","POMPE","Fusil à pompe et huit projectiles par tir."],["VX-9 DUO","PISTOLETS DOUBLES","Configuration spécifique de GHJU."],["VORTEX AR-7","FUSIL D’ASSAUT","Arme secondaire de GHJU et LYLU, viseur et jauge latérale rose de munitions."]],
enemies:[["RECO1","RECONNAISSANCE","Combattant armé. Modèle RECO1 V10 et animation native."],["ROBOT LOURD","SENTINEL MK VIII","Robot lourd : canons, missiles et blindage du jeu."],["REMPART","UNITÉ BLINDÉE","Robot de suppression avec boucliers articulés."],["SYNTH N-08","SYNTHÉTIQUE","Tacticien autonome."],["POURSUIVANT","CHÂSSIS DE SÉCURITÉ","Robot de combat équipé d'un fusil."],["BRUTE","SIÈGE","Unité lourde de choc."],["TRAQUEUR","ACOUSTIQUE","Robot de repérage."],["RAMPANT","MAINTENANCE","Châssis robotique rampant à six pattes."],["SONDE S-03","SURVEILLANCE","Drone de surveillance aérienne."]],
stats:[["VX-9","PISTOLET","Dégâts, chargeur et cadence"],["NEXUS V9","AUTOMATIQUE","Dégâts, chargeur et cadence"],["ARES X9","PRÉCISION","Dégâts, chargeur et cadence"],["THORN","RAIL","Dégâts, chargeur et cadence"],["NOVA","ÉNERGIE","Dégâts, chargeur et cadence"],["AURORA","SABRE","Puissance et cadence"],["M–12","POMPE","Dégâts, chargeur et cadence"],["VX-9 DUO","DOUBLE","Dégâts, chargeur et cadence"],["VORTEX AR-7","FUSIL D’ASSAUT","Dégâts, chargeur et cadence"]]};
const viewer=document.getElementById('viewer'),model=document.getElementById('model'),ar=document.getElementById('ar-launch'),message=document.getElementById('viewer-message');
document.getElementById('viewer-close').onclick=()=>{viewer.hidden=true;window.galleryPendingName=null;window.galleryClose?.()};
document.getElementById('rotation').onclick=()=>window.galleryToggleRotation?.();
ar.onclick=()=>{if(typeof window.galleryAR==='function')window.galleryAR();else message.textContent='Initialisation AR en cours…'};
function openViewer(name){viewer.hidden=false;document.getElementById('viewer-title').textContent=name;model.removeAttribute('src');ar.disabled=true;window.galleryPendingName=name;if(typeof window.galleryBuild==='function')window.galleryBuild(name);else message.textContent='Initialisation du visualiseur 3D natif…';}
const weaponData={"VX-9":[24,12,0.2,1.25],"NEXUS V9":[34,24,0.11,1.7],"ARES X9":[160,5,0.85,2.15],"THORN":[190,6,0.28,2.1],"NOVA":[340,4,0.4,2.4],"AURORA":[155,0,0.48,0],"M–12":[18,8,0.88,2.8],"VX-9 DUO":[24,24,0.2,1.65],"VORTEX AR-7":[43,36,0.115,1.95]};const enemyHp={RECO1:'Selon le profil actif','ROBOT LOURD':1200,REMPART:400,'SYNTH N-08':250,POURSUIVANT:180,BRUTE:340,TRAQUEUR:275,RAMPANT:140,'SONDE S-03':100};function show(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));document.querySelector('#content').replaceChildren(...entries[tab].map(([name,type,desc])=>{const card=document.createElement('article');card.className='card';const tag=document.createElement('div');tag.className='tag';tag.textContent=type;const h=document.createElement('h2');h.textContent=name;const p=document.createElement('p');p.textContent=desc;card.append(tag,h,p);const inspect=document.createElement("button");inspect.type="button";inspect.textContent="EXAMINER EN 3D ↗";inspect.onclick=()=>openViewer(name);card.append(inspect);if(tab==='stats'||tab==='enemies'){const stats=document.createElement('div');stats.className='stats';for(const label of (tab==='enemies'?['PV','Point faible']:['Puissance','Munitions','Cadence','Rechargement'])){const s=document.createElement('span');const data=weaponData[name];s.textContent=tab==='enemies'?(label==='PV'?(enemyHp[name]!==undefined?'PV de base : '+enemyHp[name]:'PV : À vérifier'):'Points faibles : capteurs / tête'):data?(label==='Puissance'?'Dégâts : '+data[0]:label==='Munitions'?'Chargeur : '+(data[1]||'sans munitions'):label==='Cadence'?'Intervalle : '+data[2]+' s':'Recharge : '+data[3]+' s'):(label+' : À synchroniser');stats.append(s)}card.append(stats)}return card}))}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('characters');
const requestedModel=new URLSearchParams(location.search).get('model')?.toUpperCase();if(entries.characters.some(e=>e[0]===requestedModel))openViewer(requestedModel);
</script><script type="module" src="gallery-3d.js?v=3.68.0"></script></body></html>
