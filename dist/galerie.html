<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PINK WARS — Galerie</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#080b13;color:#edf1fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29203b,#080b13 65%);min-height:100vh}header{padding:24px max(20px,5vw);border-bottom:1px solid #62446c}a{color:#f5a1d3;text-decoration:none}h1{letter-spacing:.16em;color:#fa85c7;margin:12px 0}main{max-width:1100px;margin:auto;padding:22px}nav{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #6b537b;background:#1b2030;color:white;border-radius:11px;padding:13px 16px;font-weight:700;cursor:pointer}button[aria-selected=true]{background:#6b2859;border-color:#f38ac5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #53435e;background:linear-gradient(150deg,#222337,#111722);border-radius:16px;padding:18px;min-height:190px}.card h2{color:#f8a4d5;margin:0 0 10px}.card p{line-height:1.5;color:#cbd2e1}.tag{font-size:12px;color:#91d7f5;letter-spacing:.12em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stats span{padding:10px;background:#0c111e;border-radius:7px;font-size:13px}.muted{color:#9ba5b8}#notice{font-size:13px;color:#b6bfd0}footer{padding:25px;text-align:center;color:#8c95a8}</style></head><body><header><a href="./">← RETOUR ACCUEIL</a><h1>PINK WARS / GALERIE</h1><div class="muted">ARCHIVES TACTIQUES · VESPER</div></header><main><nav id="tabs" aria-label="Rubriques de la galerie"><button data-tab="characters" aria-selected="true">PERSONNAGES</button><button data-tab="arsenal" aria-selected="false">ARMES · CAPACITÉS</button><button data-tab="enemies" aria-selected="false">ENNEMIS</button><button data-tab="stats" aria-selected="false">ARMES · STATISTIQUES</button></nav><p id="notice">Les chiffres non vérifiés dans le moteur de combat sont indiqués « À synchroniser ».</p><section id="content" class="grid" aria-live="polite"></section></main><footer>PINK WARS · DOSSIERS DE COMBAT</footer><script>
const entries={
characters:[["GHJU","COMBATTANTE · ROSE","Personnage jouable. GABY l'accompagne et fournit une assistance défensive : bouclier et soin."],["LYLU","COMBATTANT · BLEU","Personnage jouable. CARA l'accompagne et renforce les capacités offensives."],["GABY","IA · DÉFENSE","Compagne de GHJU. Spécialités : protection et soins."],["CARA","IA · ATTAQUE","Compagne de LYLU. Spécialité : augmentation des dégâts."]],
arsenal:[["VX-9","ARME DE POING","Arme secondaire compacte."],["NEXUS V9","ARME AUTOMATIQUE","Arme de combat à tir rapide."],["ARES X9","ARSENAL","Consulter son comportement et ses capacités dans le stand."],["THORN","ARSENAL","Consulter ses capacités dans le stand."],["NOVA","ARSENAL","Consulter ses capacités dans le stand."],["M–12","ARSENAL","Consulter ses capacités dans le stand."],["VORTEX AR-7","FUSIL D'ASSAUT","Arme futuriste à indicateur latéral rose de munitions."]],
enemies:[["RECO1","UNITÉ HUMANOÏDE","Combattant armé de taille humaine."],["ROBOT LOURD","UNITÉ BLINDÉE","Ennemi résistant. Référence de conception : environ 50 impacts de pistolet au corps ou 10 à la tête. Valeurs effectives à vérifier dans le moteur."]],
stats:[["VX-9","PISTOLET","Dégâts, chargeur et cadence"],["NEXUS V9","AUTOMATIQUE","Dégâts, chargeur et cadence"],["ARES X9","ARSENAL","Dégâts, chargeur et cadence"],["THORN","ARSENAL","Dégâts, chargeur et cadence"],["NOVA","ARSENAL","Dégâts, chargeur et cadence"],["M–12","ARSENAL","Dégâts, chargeur et cadence"],["VORTEX AR-7","FUSIL D'ASSAUT","Dégâts, chargeur et cadence"]]};
function show(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));document.querySelector('#content').replaceChildren(...entries[tab].map(([name,type,desc])=>{const card=document.createElement('article');card.className='card';const tag=document.createElement('div');tag.className='tag';tag.textContent=type;const h=document.createElement('h2');h.textContent=name;const p=document.createElement('p');p.textContent=desc;card.append(tag,h,p);if(tab==='stats'||tab==='enemies'){const stats=document.createElement('div');stats.className='stats';for(const label of (tab==='enemies'?['PV','Point faible']:['Puissance','Munitions','Cadence','Rechargement'])){const s=document.createElement('span');s.textContent=label+' : À synchroniser';stats.append(s)}card.append(stats)}return card}))}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('characters');
</script></body></html>
